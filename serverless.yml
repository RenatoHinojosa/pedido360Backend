service: pedidos360-backend

frameworkVersion: '3'

plugins:
  - serverless-dotenv-plugin

package:
  individually: true
  patterns:
    - '!.git/**'
    - '!.github/**'
    - '!node_modules/.cache/**'

custom:
  tablaProductos: Productos
  tablaOrdenes: Ordenes
  tablaNotificaciones: Notificaciones

  mensajeria:
    topicEventosOrden: pedidos360-eventos-orden
    notificaciones:
      cola: pedidos360-notificaciones
      dlq: pedidos360-notificaciones-dlq
      maxReintentos: 3

    kitchen:
      cola: q-kitchen
      dlq: q-kitchen-dlq
      tipoMensaje: PedidoAceptado
      maxReintentos: 3

    boletas:
      cola: q-boletas
      dlq: q-boletas-dlq
      tipoMensaje: PedidoDespachado
      maxReintentos: 3


provider:
  name: aws
  runtime: nodejs20.x
  region: ${env:AWS_REGION, 'us-east-1'}
  stage: ${opt:stage, 'dev'}

  # AWS Academy Learner Lab: no se pueden crear roles IAM nuevos.
  # Se referencia el LabRole ya existente usando el ID de la cuenta.
  iam:
    role: arn:aws:iam::${env:AWS_ACCOUNT_ID}:role/${env:AWS_ROLE_NAME, 'LabRole'}

  environment:
    TABLA_PRODUCTOS: ${self:custom.tablaProductos}
    TABLA_ORDENES: ${self:custom.tablaOrdenes}
    TOPIC_EVENTOS_ORDEN_ARN:
      Ref: TopicEventosOrden
  httpApi:
    cors:
      allowedOrigins:
        - http://localhost:5173
        # Agregar aquí el dominio real de producción cuando exista
      allowedHeaders:
        - Authorization
        - Content-Type
      allowedMethods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
    authorizers:
      entraAuthorizer:
        type: jwt
        identitySource: $request.header.Authorization
        issuerUrl: https://login.microsoftonline.com/${env:AZURE_TENANT_ID}/v2.0
        audience:
          - ${env:AZURE_API_AUDIENCE}

functions:
  # ---------- Catálogo ----------
  crearProducto:
    handler: src/catalogo/crearProducto.handler
    events:
      - httpApi:
          path: /productos
          method: post
          authorizer:
            name: entraAuthorizer
            scopes:
              - catalog.write

  listarProductos:
    handler: src/catalogo/listarProductos.handler
    events:
      - httpApi:
          path: /productos
          method: get
          authorizer:
            name: entraAuthorizer
            scopes:
              - catalog.read
          # Nota: requiere estar autenticado (JWT válido) y tener el scope
          # catalog.read, pero la Lambda no exige un rol específico.

  obtenerProducto:
    handler: src/catalogo/obtenerPorIdProducto.handler
    events:
      - httpApi:
          path: /productos/{id}
          method: get
          authorizer:
            name: entraAuthorizer
            scopes:
              - catalog.read

  editarProducto:
    handler: src/catalogo/editarProducto.handler
    events:
      - httpApi:
          path: /productos/{id}
          method: put
          authorizer:
            name: entraAuthorizer
            scopes:
              - catalog.write

  eliminarProducto:
    handler: src/catalogo/eliminarProducto.handler
    events:
      - httpApi:
          path: /productos/{id}
          method: delete
          authorizer:
            name: entraAuthorizer
            scopes:
              - catalog.write

  # ---------- Órdenes ----------
  crearOrden:
    handler: src/ordenes/crearOrden.handler
    events:
      - httpApi:
          path: /orders
          method: post
          authorizer:
            name: entraAuthorizer
            scopes:
              - orders.write

  listarOrdenes:
    handler: src/ordenes/listarOrdenes.handler
    events:
      - httpApi:
          path: /orders
          method: get
          authorizer:
            name: entraAuthorizer
            scopes:
              - orders.read

  obtenerOrden:
    handler: src/ordenes/obtenerOrden.handler
    events:
      - httpApi:
          path: /orders/{id}
          method: get
          authorizer:
            name: entraAuthorizer
            scopes:
              - orders.read

  cambiarEstadoOrden:
    handler: src/ordenes/cambiarEstadoOrden.handler
    events:
      - httpApi:
          path: /orders/{id}/estado
          method: patch
          authorizer:
            name: entraAuthorizer
            scopes:
              - orders.write
 # ---------- Mensajería: consumidores ----------
  enviarNotificacion:
    handler: src/mensajeria/consumidores/notificaciones/enviarNotificacion.handler
    timeout: 10
    environment:
      TABLA_NOTIFICACIONES: ${self:custom.tablaNotificaciones}
      COLA_NOTIFICACIONES_DLQ_URL:
        Ref: ColaNotificacionesDLQ
      MAX_REINTENTOS: ${self:custom.mensajeria.notificaciones.maxReintentos}
    events:
      - sqs:
          arn:
            Fn::GetAtt: [ColaNotificaciones, Arn]
          batchSize: 5
          functionResponseType: ReportBatchItemFailures
  ticketBodega:
    handler: src/mensajeria/consumidores/kitchen/ticketBodega.handler
    timeout: 10
    events:
      - sqs:
          arn:
            Fn::GetAtt: [ColaKitchen, Arn]
          batchSize: 5
          functionResponseType: ReportBatchItemFailures
  generarBoleta:
    handler: src/mensajeria/consumidores/boletas/generarBoleta.handler
    timeout: 10
    events:
      - sqs:
          arn:
            Fn::GetAtt: [ColaBoletas, Arn]
          batchSize: 5
          functionResponseType: ReportBatchItemFailures
resources:
  Resources:
    TablaProductos:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.tablaProductos}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: productId
            AttributeType: S
          - AttributeName: categoria
            AttributeType: S
        KeySchema:
          - AttributeName: productId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: CategoriaIndex
            KeySchema:
              - AttributeName: categoria
                KeyType: HASH
            Projection:
              ProjectionType: ALL

    TablaOrdenes:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.tablaOrdenes}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: orderId
            AttributeType: S
          - AttributeName: creadoPor
            AttributeType: S
        KeySchema:
          - AttributeName: orderId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: CreadoPorIndex
            KeySchema:
              - AttributeName: creadoPor
                KeyType: HASH
            Projection:
              ProjectionType: ALL

    TablaNotificaciones:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.tablaNotificaciones}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: notificationId
            AttributeType: S
        KeySchema:
          - AttributeName: notificationId
            KeyType: HASH

# ---------- Mensajería: flujo de notificaciones ----------

    # El "megáfono": un solo aviso que se reparte a quien esté suscrito
    TopicEventosOrden:
      Type: AWS::SNS::Topic
      Properties:
        TopicName: ${self:custom.mensajeria.topicEventosOrden}

    # La "bandeja de problemas": aquí llegan los mensajes que fallaron demasiadas veces
    ColaNotificacionesDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:custom.mensajeria.notificaciones.dlq}
        MessageRetentionPeriod: 1209600   # 14 días para poder revisarlos

    # La "bandeja de tareas" normal
    ColaNotificaciones:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:custom.mensajeria.notificaciones.cola}
        VisibilityTimeout: 30
        RedrivePolicy:
          deadLetterTargetArn:
            Fn::GetAtt: [ColaNotificacionesDLQ, Arn]
          maxReceiveCount: ${self:custom.mensajeria.notificaciones.maxReintentos}

    # Permiso para que el megáfono pueda dejar papelitos en esta bandeja
    ColaNotificacionesPolicy:
      Type: AWS::SQS::QueuePolicy
      Properties:
        Queues:
          - Ref: ColaNotificaciones
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: sns.amazonaws.com
              Action: sqs:SendMessage
              Resource:
                Fn::GetAtt: [ColaNotificaciones, Arn]
              Condition:
                ArnEquals:
                  aws:SourceArn:
                    Ref: TopicEventosOrden

    # Correo recibe todos los tipos de eventos publicados por este productor.
    SuscripcionNotificaciones:
      Type: AWS::SNS::Subscription
      Properties:
        TopicArn:
          Ref: TopicEventosOrden
        Protocol: sqs
        Endpoint:
          Fn::GetAtt: [ColaNotificaciones, Arn]
        RawMessageDelivery: true
        FilterPolicyScope: MessageAttributes
        FilterPolicy:
          tipo:
            - PedidoAceptado
            - PedidoDespachado
            - CambioEstadoPedido

  # ---------- Mensajería: flujo de Kitchen ----------

    ColaKitchenDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:custom.mensajeria.kitchen.dlq}
        MessageRetentionPeriod: 1209600

    ColaKitchen:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:custom.mensajeria.kitchen.cola}
        VisibilityTimeout: 30
        RedrivePolicy:
          deadLetterTargetArn:
            Fn::GetAtt: [ColaKitchenDLQ, Arn]
          maxReceiveCount: ${self:custom.mensajeria.kitchen.maxReintentos}

    ColaKitchenPolicy:
      Type: AWS::SQS::QueuePolicy
      Properties:
        Queues:
          - Ref: ColaKitchen
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: sns.amazonaws.com
              Action: sqs:SendMessage
              Resource:
                Fn::GetAtt: [ColaKitchen, Arn]
              Condition:
                ArnEquals:
                  aws:SourceArn:
                    Ref: TopicEventosOrden

    SuscripcionKitchen:
      Type: AWS::SNS::Subscription
      Properties:
        TopicArn:
          Ref: TopicEventosOrden
        Protocol: sqs
        Endpoint:
          Fn::GetAtt: [ColaKitchen, Arn]
        RawMessageDelivery: true
        FilterPolicyScope: MessageAttributes
        FilterPolicy:
          tipo:
            - ${self:custom.mensajeria.kitchen.tipoMensaje}

  # ---------- Mensajería: flujo de boletas ----------

    ColaBoletasDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:custom.mensajeria.boletas.dlq}
        MessageRetentionPeriod: 1209600

    ColaBoletas:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:custom.mensajeria.boletas.cola}
        VisibilityTimeout: 30
        RedrivePolicy:
          deadLetterTargetArn:
            Fn::GetAtt: [ColaBoletasDLQ, Arn]
          maxReceiveCount: ${self:custom.mensajeria.boletas.maxReintentos}

    ColaBoletasPolicy:
      Type: AWS::SQS::QueuePolicy
      Properties:
        Queues:
          - Ref: ColaBoletas
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: sns.amazonaws.com
              Action: sqs:SendMessage
              Resource:
                Fn::GetAtt: [ColaBoletas, Arn]
              Condition:
                ArnEquals:
                  aws:SourceArn:
                    Ref: TopicEventosOrden

    SuscripcionBoletas:
      Type: AWS::SNS::Subscription
      Properties:
        TopicArn:
          Ref: TopicEventosOrden
        Protocol: sqs
        Endpoint:
          Fn::GetAtt: [ColaBoletas, Arn]
        RawMessageDelivery: true
        FilterPolicyScope: MessageAttributes
        FilterPolicy:
          tipo:
            - ${self:custom.mensajeria.boletas.tipoMensaje}



 
  Outputs:
    ApiUrl:
      Description: URL base del API Gateway desplegado
      Value:
        Fn::Sub: 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com'

    TopicEventosOrdenArn:
      Description: ARN del topic de eventos de orden
      Value:
        Ref: TopicEventosOrden
    ColaNotificacionesUrl:
      Description: URL de la cola de notificaciones
      Value:
        Ref: ColaNotificaciones
    ColaKitchenUrl:
      Description: URL de la cola de Kitchen
      Value:
        Ref: ColaKitchen
    ColaBoletasUrl:
      Description: URL de la cola de boletas
      Value:
        Ref: ColaBoletas
